# K-FACE "small" — same redesign as kface_n (no stride 8 / no small-face
# priority, dedicated stride 64 for near-full-frame faces instead of a
# lone anchor 512 at stride 32). Deploy target is 640x640: stride16's
# feature map (40x40 @640) is the expensive one to widen, so it's kept the
# same shape as kface_n's; the accuracy budget over kface_n goes entirely
# into stride32/64 (256ch, cheap at their small grid sizes) instead.
# Benchmarked at 640, 4 threads: ~59 FPS (vs kface_n's ~90, det_500m's ~95).
model:
  stem_channels: 16
  stages:
    - {type: dw,    channels: 32,  blocks: 1}
    - {type: dw,    channels: 48,  blocks: 1}
    - {type: ir,    channels: 128, blocks: 2, expand: 2, se: true}
    - {type: dense, channels: 256, blocks: 3, se: true}
    - {type: dense, channels: 256, blocks: 2, se: true}
  out_stages: [2, 3, 4]
  neck_channels: 80
  neck_smooth: [dense, dense]
  head_stem_blocks: 2
  num_anchors: 3
  strides: [16, 32, 64]
  scales_per_stride: [[24, 48, 96], [128, 176, 256], [320, 416, 512]]

data:
  train_label: data/widerface/train/label.txt
  train_images: data/widerface/train/images
  val_label: data/widerface/val/label.txt
  val_images: data/widerface/val/images

train:
  input_size: 640
  batch_size: 64
  num_workers: 4
  prefetch_factor: 2
  oversample_alpha: 0.5        # downweight images by 1/(1+n_small_faces)^alpha; 0 = off
  amp_dtype: bf16
  channels_last: true
  epochs: 300
  lr: 0.02
  warmup_iters: 1000
  weight_decay: 0.0005
  atss_topk: 9
  box_weight: 2.0
  kps_weight: 0.5
  log_interval: 20
  output_dir: runs/kface_s

  eval_interval: 5
  eval_max_images: 0
  eval_batch_size: 16
  eval_conf: 0.02
  eval_nms: 0.4
  eval_iou: 0.5
  early_stop_metric: AP50
  early_stop_patience: 12
  restore_best_on_plateau: true
  save_every: 5
