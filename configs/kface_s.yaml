# K-FACE "small" — max capacity at roughly reference-detector latency. Author: kienkk
#   1.567M params, 0.536 GFLOPs, 44 conv nodes @320x320.
#   Benchmarked at parity-to-faster than the ~0.6M-param reference detector
#   at 4 threads (0.78-1.01x latency), ~10% slower at 1 thread (1.11x),
#   while carrying ~2.5x the parameters.
model:
  stem_channels: 16
  stages:
    - {type: dw,    channels: 32,  blocks: 1}
    - {type: dw,    channels: 64,  blocks: 2}
    - {type: ir,    channels: 128, blocks: 2, expand: 2}
    - {type: dense, channels: 192, blocks: 2}
  neck_channels: 48
  neck_smooth: [dw, dense]
  head_stem_blocks: 1
  num_anchors: 2
  strides: [8, 16, 32]
  scales_per_stride: [[16, 32], [64, 128], [256, 512]]

data:
  train_label: data/widerface/train/label.txt
  train_images: data/widerface/train/images
  val_label: data/widerface/val/label.txt
  val_images: data/widerface/val/images

train:
  # Trained at 640 for small-face recall (anchor scales are in absolute
  # pixels, so they don't need retuning); export/infer can still target a
  # smaller size (e.g. 320) for CPU throughput — the model is fully
  # convolutional and resolution-agnostic at inference time.
  input_size: 640
  batch_size: 64          # tuned for a single 24GB L4 (more params than kface_n); lower if you see OOM
  num_workers: 12         # match to the GPU instance's vCPU count
  prefetch_factor: 4
  amp_dtype: bf16         # Ada tensor cores run bf16 natively; no GradScaler needed
  channels_last: true
  epochs: 300
  lr: 0.02
  warmup_iters: 1000
  weight_decay: 0.0005
  atss_topk: 9
  box_weight: 2.0
  kps_weight: 0.5
  log_interval: 20
  output_dir: runs/kface_s
