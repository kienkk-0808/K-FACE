# K-FACE "small" — 1.567M params, 0.536 GFLOPs, 44 conv nodes @320x320.
model:
  stem_channels: 16
  stages:
    - {type: dw,    channels: 32,  blocks: 1}
    - {type: dw,    channels: 64,  blocks: 2}
    - {type: ir,    channels: 128, blocks: 2, expand: 2}
    - {type: dense, channels: 192, blocks: 2}
  neck_channels: 48
  neck_smooth: [dw, dense]
  head_stem_blocks: 1
  num_anchors: 2
  strides: [8, 16, 32]
  scales_per_stride: [[16, 32], [64, 128], [256, 512]]

data:
  train_label: data/widerface/train/label.txt
  train_images: data/widerface/train/images
  val_label: data/widerface/val/label.txt
  val_images: data/widerface/val/images

train:
  input_size: 640
  batch_size: 64
  num_workers: 4
  prefetch_factor: 2
  amp_dtype: bf16
  channels_last: true
  epochs: 300
  lr: 0.02
  warmup_iters: 1000
  weight_decay: 0.0005
  atss_topk: 9
  box_weight: 2.0
  kps_weight: 0.5
  log_interval: 20
  output_dir: runs/kface_s

  eval_interval: 5
  eval_max_images: 500
  eval_batch_size: 16
  eval_conf: 0.02
  eval_nms: 0.4
  eval_iou: 0.5
  early_stop_metric: AP50
  early_stop_patience: 6
  restore_best_on_plateau: true
  save_every: 5
